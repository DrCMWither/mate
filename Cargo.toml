[package]
name = "mate"
version = "0.1.0"
edition = "2021"
description = "A safe, interactive meta package-manager prototype"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
dunce = "1.0"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
strsim = "0.11"
tokio = { version = "1.43", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.15"
